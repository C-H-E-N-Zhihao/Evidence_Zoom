<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="860" height="440" rx="16" fill="#ffffff"/><rect x="0.5" y="0.5" width="859" height="439" rx="16" fill="none" stroke="#e6e8f0"/><text x="24" y="34" font-size="18" font-weight="700" fill="#141826" text-anchor="start">Tokens per correct answer</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">lower is better · each row compares with the same model</text><path d="M560,24 h10 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-10 z" fill="#3b3bdb"/><text x="580" y="36" font-size="12.5" font-weight="600" fill="#141826" text-anchor="start">Evidence Zoom</text><path d="M690,24 h10 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-10 z" fill="#c9cdd8"/><text x="710" y="36" font-size="12.5" font-weight="600" fill="#141826" text-anchor="start">original image</text><line x1="24" y1="76" x2="836" y2="76" stroke="#e6e8f0"/><text x="24" y="100" font-size="14" font-weight="700" fill="#141826" text-anchor="start">Fresh receipt photos (held out)</text><text x="24" y="118" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">248 questions · Haiku · one paired run</text><path d="M290,90 h54.08 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-54.08 z" fill="#3b3bdb"/><text x="356.08" y="103" font-size="13" font-weight="700" fill="#141826" text-anchor="start">968</text><text x="384.88" y="103" font-size="13" font-weight="800" fill="#3b3bdb" text-anchor="start">−65%</text><path d="M290,114 h160.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-160.4 z" fill="#c9cdd8"/><text x="462.4" y="127" font-size="13" font-weight="700" fill="#141826" text-anchor="start">2,740</text><text x="506.4" y="127" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">original photo</text><line x1="24" y1="148" x2="836" y2="148" stroke="#e6e8f0"/><text x="24" y="172" font-size="14" font-weight="700" fill="#141826" text-anchor="start">Configured claim form (synthetic)</text><text x="24" y="190" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">96 questions · Sonnet on both sides</text><path d="M290,162 h42.44 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-42.44 z" fill="#3b3bdb"/><text x="344.44" y="175" font-size="13" font-weight="700" fill="#141826" text-anchor="start">774</text><path d="M290,186 h337.76 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-337.76 z" fill="#c9cdd8"/><text x="639.76" y="199" font-size="13" font-weight="700" fill="#141826" text-anchor="start">5,696</text><text x="683.76" y="199" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">cached whole page</text><line x1="24" y1="220" x2="836" y2="220" stroke="#e6e8f0"/><text x="24" y="244" font-size="14" font-weight="700" fill="#141826" text-anchor="start">Second configured layout (synthetic)</text><text x="24" y="262" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">96 questions · Haiku</text><path d="M290,234 h46.46 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-46.46 z" fill="#3b3bdb"/><text x="348.46" y="247" font-size="13" font-weight="700" fill="#141826" text-anchor="start">841</text><path d="M290,258 h352.76 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-352.76 z" fill="#c9cdd8"/><text x="654.76" y="271" font-size="13" font-weight="700" fill="#141826" text-anchor="start">5,946</text><text x="698.76" y="271" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">original page</text><line x1="24" y1="292" x2="836" y2="292" stroke="#e6e8f0"/><text x="24" y="316" font-size="14" font-weight="700" fill="#141826" text-anchor="start">DocVQA scans (public benchmark)</text><text x="24" y="334" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">100 questions · Haiku</text><path d="M290,306 h90.44 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-90.44 z" fill="#3b3bdb"/><text x="392.44" y="319" font-size="13" font-weight="700" fill="#141826" text-anchor="start">1,574</text><path d="M290,330 h271.22 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-271.22 z" fill="#c9cdd8"/><text x="573.22" y="343" font-size="13" font-weight="700" fill="#141826" text-anchor="start">4,587</text><text x="617.22" y="343" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">original page, separately prompted</text><line x1="24" y1="364" x2="836" y2="364" stroke="#e6e8f0"/><text x="24" y="384" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">One run each. Claim form: against the cached whole page. Second layout: template engine tuned on it before the freeze.</text><text x="24" y="400" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Limits: with open models (Qwen 7B / 72B) routing gave more wrong answers (31 vs 14; 13 vs 6). On layouts we never</text><text x="24" y="416" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">configured there is no region selection, and a plain smaller page was slightly cheaper than our route.</text></svg>