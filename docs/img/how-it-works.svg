<svg xmlns="http://www.w3.org/2000/svg" width="860" height="304" viewBox="0 0 860 304" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="860" height="304" rx="16" fill="#f4f5fb"/><text x="24" y="34" font-size="18" font-weight="700" fill="#141826" text-anchor="start">How a question is answered</text><text x="268" y="34" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">cheapest step first: the model is called only when the steps before it could not answer</text><rect x="24" y="56" width="182" height="150" rx="14" fill="#ffffff" stroke="#0f9d6b" stroke-width="1.5"/><circle cx="46" cy="80" r="11" fill="#0f9d6b"/><text x="46" y="84.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="64" y="85" font-size="14.5" font-weight="700" fill="#141826" text-anchor="start">Read locally</text><text x="38" y="112" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">OCR on this computer.</text><text x="38" y="130" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Some printed fields</text><text x="38" y="148" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">are answered here.</text><rect x="38" y="172" width="109.0" height="22" rx="11" fill="#e3f5ee"/><text x="92.5" y="187" font-size="11.5" font-weight="700" fill="#0f9d6b" text-anchor="middle">no model · $0</text><line x1="210" y1="131.0" x2="228" y2="131.0" stroke="#6b7280" stroke-width="2"/><path d="M228,126.0 l7,5 l-7,5 z" fill="#6b7280"/><rect x="234" y="56" width="182" height="150" rx="14" fill="#ffffff" stroke="#3b3bdb" stroke-width="1.5"/><circle cx="256" cy="80" r="11" fill="#3b3bdb"/><text x="256" y="84.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="274" y="85" font-size="14.5" font-weight="700" fill="#141826" text-anchor="start">Send less</text><text x="248" y="112" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Known form: its layout</text><text x="248" y="130" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">picks the crop. Anything</text><text x="248" y="148" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">else: a small page (768 px).</text><rect x="248" y="172" width="102.0" height="22" rx="11" fill="#e6e6fb"/><text x="299.0" y="187" font-size="11.5" font-weight="700" fill="#3b3bdb" text-anchor="middle">vision model</text><line x1="420" y1="131.0" x2="438" y2="131.0" stroke="#6b7280" stroke-width="2"/><path d="M438,126.0 l7,5 l-7,5 z" fill="#6b7280"/><rect x="444" y="56" width="182" height="150" rx="14" fill="#ffffff" stroke="#0f9d6b" stroke-width="1.5"/><circle cx="466" cy="80" r="11" fill="#0f9d6b"/><text x="466" y="84.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="484" y="85" font-size="14.5" font-weight="700" fill="#141826" text-anchor="start">Check</text><text x="458" y="112" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Small page: is the answer</text><text x="458" y="130" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">in the local OCR text?</text><text x="458" y="148" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Yes: stop here.</text><rect x="458" y="172" width="109.0" height="22" rx="11" fill="#e3f5ee"/><text x="512.5" y="187" font-size="11.5" font-weight="700" fill="#0f9d6b" text-anchor="middle">no model · $0</text><line x1="630" y1="131.0" x2="648" y2="131.0" stroke="#6b7280" stroke-width="2"/><path d="M648,126.0 l7,5 l-7,5 z" fill="#6b7280"/><rect x="654" y="56" width="182" height="150" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="676" cy="80" r="11" fill="#141826"/><text x="676" y="84.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="694" y="85" font-size="14.5" font-weight="700" fill="#141826" text-anchor="start">Answer, or flag it</text><text x="668" y="112" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Evidence drawn on the image,</text><text x="668" y="130" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">or flagged for human</text><text x="668" y="148" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">review with a ticket.</text><rect x="668" y="172" width="137.0" height="22" rx="11" fill="#e5e7eb"/><text x="736.5" y="187" font-size="11.5" font-weight="700" fill="#141826" text-anchor="middle">flagged if unsure</text><path d="M535.0,208 v24 H325.0 v-18" fill="none" stroke="#3b3bdb" stroke-width="2" stroke-dasharray="5 4"/><path d="M320.0,216 l5,-8 l5,8 z" fill="#3b3bdb"/><text x="430.0" y="250" font-size="12" font-weight="600" fill="#3b3bdb" text-anchor="middle">not in the OCR text: send a sharper page (≥ 1568 px if the photo allows)</text><text x="24" y="288" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Vision model: Claude Haiku in the cloud, or Qwen2.5-VL 7B on this laptop (on-device mode).</text></svg>