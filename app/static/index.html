<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Zoom</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Evidence Zoom <span class="tag">frugal multimodal QA</span></div>
  <select id="mode-pick" class="model-pick" title="Which route answers. Text first was cheaper on printed worksheets but scored lower overall on real documents. Auto: worksheets text first, other images to the claim router (whole page when no template matches).">
    <option value="">Auto (claim form / worksheet)</option>
    <option value="claims">Claim form router</option>
    <option value="worksheet">Worksheet: OCR text first</option>
    <option value="general">Any image: whole page</option>
  </select>
  <select id="model-pick" class="model-pick" hidden title="Model used for questions that need pixels"></select>
  <button class="btn tour-btn" id="tour-btn" type="button">▶ Guided tour</button>
  <button class="btn ghost claims-btn" id="claims-btn" type="button">What we measured</button>
  <div class="pipeline" id="pipeline">pipeline: –</div>
</header>
<div class="tour" id="tour" hidden>
  <span id="tour-say"></span>
  <button class="btn" id="tour-next" type="button">Start ▶</button>
  <button class="btn ghost" id="tour-exit" type="button">Exit</button>
</div>
<div class="banner" id="banner" hidden></div>

<main>
  <section class="viewer">
    <div class="toolbar">
      <select id="pair" title="Gold-labelled fixture forms"><option value="">Fixture form…</option></select>
      <div class="seg" id="ab" hidden>
        <button data-k="a" class="on">form a</button><button data-k="b">form b</button>
      </div>
      <label class="btn ghost">Upload<input type="file" id="file" accept="image/*" hidden></label>
      <label class="toggle"><input type="checkbox" id="showGrid"> grid</label>
    </div>
    <div class="formnote" id="formnote" hidden></div>
    <div class="stage" id="stage">
      <div class="empty" id="empty">Pick a fixture form or upload an image</div>
      <img id="img" alt="">
      <canvas id="overlay"></canvas>
    </div>
    <div class="legend">
      <span><i class="sw ocr"></i>OCR evidence</span>
      <span><i class="sw zoomcell"></i>region sent to the model</span>
      <span><i class="sw zoom"></i>box the model pointed to (not verified)</span>
    </div>
  </section>

  <section class="side">
    <div class="meter" id="meter">
      <div class="meter-title">Session cost <span class="est">estimated</span></div>
      <div class="bars">
        <div class="bar-row"><span>Evidence Zoom</span><div class="bar"><div id="b-ours"></div></div><b id="v-ours">$0</b></div>
        <div class="bar-row"><span id="l-cached">Full image, cached</span><div class="bar"><div id="b-cached"></div></div><b id="v-cached">$0</b></div>
        <div class="bar-row"><span id="l-full">Full image</span><div class="bar"><div id="b-full"></div></div><b id="v-full">$0</b></div>
      </div>
      <div class="meter-foot" id="meter-foot">0 questions</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="suggest" id="suggest"></div>
    <form id="ask">
      <input id="q" placeholder="Ask about the image…" autocomplete="off" disabled>
      <button class="btn" id="send" disabled>Ask</button>
    </form>
  </section>
</main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head"><b>What we measured</b><button class="btn ghost" id="drawer-close" type="button">Close</button></div>
  <div id="drawer-body"></div>
</aside>
<script src="/static/app.js"></script>
</body>
</html>
